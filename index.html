    <style>
      /* The loading screen. Inline, so it is the first thing painted (never an unstyled page while the game
         downloads); everything else is styled once the game's own CSS arrives. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #35373b;
        transition: opacity 0.3s ease, visibility 0s linear 0.3s;
      }
      #boot.gone { opacity: 0; visibility: hidden; pointer-events: none; }
      .boot-stage { display: flex; flex-direction: column; align-items: center; gap: 22px; animation: boot-in 0.4s ease-out both; }
      .boot-logo { display: block; width: 128px; height: auto; }
      .boot-bar { position: relative; width: 96px; height: 3px; overflow: hidden; border-radius: 2px; background: rgba(255, 255, 255, 0.16); }
      .boot-bar i { position: absolute; inset: 0; width: 40%; border-radius: 2px; background: #fff; animation: boot-load 1.1s ease-in-out infinite; }
      @keyframes boot-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes boot-load { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      .boot-status {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      .boot-retry {
        display: block;
        margin: 16px auto 0;
        padding: 12px 22px;
        border: 0;
        border-radius: 4px;
        background: #fff;
        color: #35373b;
        font: 700 14px/1 system-ui, sans-serif;
        letter-spacing: 0.5px;
        cursor: pointer;
      }
      #boot.failed { flex-direction: column; overflow-y: auto; box-sizing: border-box; padding: 20px; }
      #boot.failed .boot-bar { display: none; }
      #boot.failed .boot-status {
        position: static;
        width: auto;
        height: auto;
        max-width: 420px;
        margin: 24px 0 0;
        clip-path: none;
        white-space: normal;
        text-align: center;
        color: #fff;
        font: 15px/1.5 system-ui, sans-serif;
      }
      @media (max-width: 560px), (max-height: 420px) {
        .boot-logo { width: 108px; }
        .boot-bar { width: 80px; }
        .boot-stage { gap: 18px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-stage { animation: none; }
        .boot-bar i { width: 100%; animation: none; opacity: 0.55; }
        #boot { transition: none; }
      }
    </style>
